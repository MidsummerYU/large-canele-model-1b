[project]
name = "newcomer-qa"
version = "0.1.0"
description = "Multilingual Q&A benchmark on Swiss administrative procedures for newcomers"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "openai>=1.50",
    "py3langid>=0.4.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "selectolax>=0.3.27",
]

[project.scripts]
newcomer-qa = "newcomer_qa.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/newcomer_qa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
